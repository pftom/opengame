<rect x="42" y="300" width="192" height="92" rx="10" fill="#e4f1e8" stroke="#b9d7cc"/>
<text x="138.0" y="334" font-size="23" font-weight="700" fill="#202322">Understand</text>
<text x="138.0" y="365" font-size="16" font-weight="400" fill="#46615c">Core loop + audience</text>
<path d="M234 345h34" fill="none" stroke="#087c62" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="273" y="300" width="192" height="92" rx="10" fill="#e4f1e8" stroke="#b9d7cc"/>
