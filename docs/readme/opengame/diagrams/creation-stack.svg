<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">From a game idea to a game business</title><desc id="desc">One creation loop. Your agent, your source, your release.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#087c62" stroke-width="1.5"/></marker></defs><rect width="1200" height="500" rx="14" fill="#fafaf2"/><g font-family="Arial, Helvetica, PingFang SC, Hiragino Sans, Microsoft YaHei, sans-serif" text-anchor="middle">
<text x="600" y="64" font-size="32" font-weight="700" fill="#202322">From a game idea to a game business</text>
<text x="600" y="99" font-size="17" font-weight="400" fill="#46615c">One creation loop. Your agent, your source, your release.</text>
