<rect x="504" y="300" width="192" height="92" rx="10" fill="#e4f1e8" stroke="#b9d7cc"/>
<text x="600.0" y="334" font-size="23" font-weight="700" fill="#202322">Create assets</text>
<text x="600.0" y="365" font-size="16" font-weight="400" fill="#46615c">Art, music and voice</text>
