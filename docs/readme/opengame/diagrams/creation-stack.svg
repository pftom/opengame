<text x="600.0" y="198" font-size="16" font-weight="400" fill="#46615c">Study the loop. Make it yours.</text>
<path d="M600 227V254" fill="none" stroke="#087c62" stroke-width="2"/>
<rect x="800" y="133" width="352" height="94" rx="10" fill="#fff" stroke="#b9d7cc"/>
<text x="976.0" y="167" font-size="23" font-weight="700" fill="#202322">Your agent + media models</text>
<text x="976.0" y="198" font-size="16" font-weight="400" fill="#46615c">29 agents · image, video and audio</text>
<path d="M976 227V254" fill="none" stroke="#087c62" stroke-width="2"/>
<path d="M138 254H976" fill="none" stroke="#087c62" stroke-width="2"/>
